name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup network
        run: |
          docker network create --driver bridge se-methods || true
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods mongo

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Show built artifacts
        run: ls -la target || true

      - name: Build Docker Image
        run: docker build -t se_methods .

      - name: Run image
        run: docker run --name se_methods_container -d se_methods

      - name: View logs
        run: docker logs se_methods_container
